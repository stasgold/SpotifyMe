# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen generate
name: SpotifyMe
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SpotifyMeCore:
    path: Packages/SpotifyMeCore

configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

targets:
  SpotifyMe:
    type: application
    platform: iOS
    sources:
      - path: SpotifyMe
    dependencies:
      - package: SpotifyMeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        # Overridden in CI with the GitHub run number so every TestFlight upload is unique.
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: SpotifyMe/Resources/Info.plist
      properties:
        CFBundleDisplayName: SpotifyMe
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only standard HTTPS is used, so TestFlight doesn't ask the export-compliance question.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        SpotifyClientID: $(SPOTIFY_CLIENT_ID)
        GetSongBPMAPIKey: $(GETSONGBPM_API_KEY)
        CFBundleURLTypes:
          - CFBundleURLName: spotifyme-auth
            CFBundleURLSchemes: [spotifyme]

schemes:
  SpotifyMe:
    build:
      targets:
        SpotifyMe: all
    test:
      targets:
        - package: SpotifyMeCore/SpotifyMeCoreTests
