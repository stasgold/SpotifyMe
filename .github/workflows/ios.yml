name: iOS build & tests

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version && swift --version

      - name: Unit tests (SpotifyMeCore)
        working-directory: Packages/SpotifyMeCore
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cp Config.example.xcconfig Config.xcconfig
          # Dummy client ID so the build has a value; not a real credential.
          sed -i '' 's/^SPOTIFY_CLIENT_ID =.*/SPOTIFY_CLIENT_ID = ci-placeholder/' Config.xcconfig
          xcodegen generate

      - name: Build app (iOS Simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project SpotifyMe.xcodeproj \
            -scheme SpotifyMe \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
